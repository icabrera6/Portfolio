<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Profile photo</title>
<link rel="stylesheet" href="brand.css">
<style>
    /* Square profile picture. Everything that matters sits inside the inscribed circle (LinkedIn crops to a circle). */
    html, body, .canvas { width: 100vw; height: 100vh; }
    .canvas {
        background: radial-gradient(52% 52% at 50% 50%, rgba(30, 58, 110, .7), transparent 75%), var(--ink);
        --grid: 5vw;
        --grid-mask: radial-gradient(46% 46% at 50% 50%, #000, transparent 85%);
    }
    .ring-box { position: absolute; left: 5%; top: 5%; width: 90%; height: 90%; }
    .ring-box svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .arc { fill: var(--ivory); }
    .node { fill: var(--ink); stroke: var(--ion); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
    /* Photo fills the ring's inner circle (r 44 of 120) */
    .photo {
        position: absolute;
        left: 13.333%; top: 13.333%;
        width: 73.333%; height: 73.333%;
        border-radius: 50%;
        object-fit: cover;
        background: #0f141e;
        box-shadow: 0 2vw 6vw -1vw rgba(30, 58, 110, .9);
    }
</style>
</head>
<body>
<div class="canvas grid grain">
    <div class="ring-box">
        <svg viewBox="0 0 120 120" aria-hidden="true">
            <g class="guides">
                <circle cx="60" cy="60" r="57" stroke-dasharray="1.2 2.4"/>
                <line x1="60" y1="-14" x2="60" y2="134"/>
                <line x1="-14" y1="60" x2="96" y2="60"/>
                <line x1="96" y1="48" x2="150" y2="48" stroke-dasharray="2 2"/>
                <line x1="96" y1="72" x2="150" y2="72" stroke-dasharray="2 2"/>
            </g>
            <path class="arc" d="M110.6 48 A52 52 0 1 0 110.6 72 L107.51 72 A49 49 0 1 1 107.51 48 Z"/>
            <circle class="node" cx="110.6" cy="48" r="1.3"/><circle class="node" cx="110.6" cy="72" r="1.3"/>
        </svg>
        <img class="photo" src="../../src/assets/pfp.webp" alt="">
    </div>
</div>
<script type="module">
    import { ready } from './brand.js';
    await document.querySelector('.photo').decode();
    await ready();
</script>
</body>
</html>
