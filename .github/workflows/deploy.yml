name: Deploy to AWS S3 and CloudFront

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:  # Permite ejecutar manualmente desde GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: the sitemap's lastmod comes from git log
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: eu-west-1
      
      - name: Sync files to S3
        run: |
          BUCKET=s3://isaac-cabrera-portfolio
          EDGE="s-maxage=31536000"  # CloudFront keeps files until the invalidation on the next deploy

          # Build assets with a content hash in the name: cached for a year
          aws s3 sync dist/_astro $BUCKET/_astro --delete \
            --cache-control "public,max-age=31536000,immutable"

          # Files at stable URLs (favicons, OG image, CV): a day in browsers
          aws s3 sync dist/ $BUCKET --delete \
            --exclude "_astro/*" --exclude "*.html" --exclude "*.json" --exclude "*.txt" --exclude "*.xml" \
            --cache-control "public,max-age=86400,$EDGE"

          # HTML: browsers always revalidate
          aws s3 sync dist/ $BUCKET --delete \
            --exclude "*" --include "*.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "public,max-age=0,$EDGE,must-revalidate"

          # Sitemaps and robots: same as HTML
          aws s3 sync dist/ $BUCKET --delete \
            --exclude "*" --include "*.json" --include "*.txt" --include "*.xml" \
            --cache-control "public,max-age=0,$EDGE,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E34Z96GLOCBRS4 \
            --paths "/*"
      
      - name: Deployment summary
        run: |
          echo "✅ Deployment completed successfully!"
          echo ""
          echo "🌐 Portfolio URLs:"
          echo "  Custom Domain: https://icabrera-portfolio.com"
          echo "  CloudFront: https://d1brxm97sxg46g.cloudfront.net"
          echo ""
          echo "⏰ Changes may take 1-5 minutes to propagate through CloudFront"
